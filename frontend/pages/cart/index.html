<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldwork / Shopping Cart</title>
    <link rel="stylesheet" href="/shared/styles/base.css" />
    <link rel="stylesheet" href="/shared/styles/theme.css" />

  <body>
    <div id="shell"></div>
    <main>
      <span class="eyebrow">YOUR NEXT ADVENTURE</span>

          <a class="button primary" id="checkoutLink" href="/pages/checkout/"

          >
          <p class="small spaced">
            ราคาจริงและสต๊อกจะตรวจอีกครั้งที่ backend ตอนยืนยันออเดอร์
          </p>
        </section>
      </div>
    </main>
    <footer class="site-footer" id="footer"></footer>
    <script type="module" src="./page.js"></script>
