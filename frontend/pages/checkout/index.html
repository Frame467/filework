<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fieldwork / Checkout</title>
    <link rel="stylesheet" href="/shared/styles/base.css" />
    <link rel="stylesheet" href="/shared/styles/theme.css" />
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <div id="shell"></div>
    <main>
      <span class="eyebrow">ONE MORE STEP</span>
      <h1>Ready to go.</h1>
      <div class="split">
        <section class="panel">
          <h2>สรุปรายการสินค้า</h2>
          <div id="summary"></div>
          <a href="/pages/cart/" class="button spaced">← แก้ตะกร้า</a>
        </section>
        <section class="panel">
          <h2>จัดส่งถึงคุณ</h2>
          <p class="small">
            คำสั่งซื้อเดโม ไม่มีการเรียกเก็บเงินจริง ไม่ต้องใส่ข้อมูลส่วนตัวจริง
          </p>
          <form id="checkout">
            <label
              >ชื่อผู้รับ<input
                name="name"
                required
                maxlength="100"
                value="ลูกค้าทดลอง" /></label
            ><label
              >ที่อยู่จัดส่ง<textarea name="address" required maxlength="500">
123 Demo Street, Bangkok</textarea
              >
            </label>
            <div class="row between total">
              <span>รวมทั้งหมด</span><strong id="total">—</strong>
            </div>
            <p class="small muted">จัดส่งฟรี · ราคาเดโมรวมภาษีแล้ว</p>
            <button class="primary" id="submit" type="submit">
              ยืนยันคำสั่งซื้อจำลอง →
            </button>
            <div
              id="checkoutResult"
              class="action-result"
              aria-live="polite"
            ></div>
          </form>
        </section>
      </div>
    </main>
    <footer class="site-footer" id="footer"></footer>
    <script type="module" src="./page.js"></script>
  </body>
</html>
